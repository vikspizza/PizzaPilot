<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vik's Pizza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .coming-soon {
	  margin-top: 1.25rem;
	  font-size: clamp(1.2rem, 2.5vw, 1.75rem);
	  letter-spacing: 0.35em;
	  font-weight: 600;
	  opacity: 0.9;
	}
	
	.coming-soon::before,
	.coming-soon-divider {
	  display: block;
	  width: 80px;
	  height: 1px;
	  background: rgba(255,255,255,0.4);
	  margin-left: auto;
	  margin-right: auto;
	}

	.coming-soon::before {
	  content: "";
	  margin-bottom: 1rem;
	}

	.coming-soon-divider {
	  margin: 1rem auto;
	  border: 0;
	  padding: 0;
	}


	img {
	  width: clamp(280px, 40vw, 520px);
	  height: auto;
	  margin-bottom: 1.75rem;
	}

    h1 {
      font-size: 2.2rem;
      margin: 0.5rem 0;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 1rem;
      opacity: 0.8;
      margin: 0.25rem 0;
    }

    .journey-link {
      display: inline-block;
      padding: 0.75rem 1.35rem;
      border: 2px solid #ffffff;
      border-radius: 999px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .journey-link:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .cta-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      margin-top: 1.6rem;
    }

    .support-link {
      display: inline-block;
      padding: 0.75rem 1.35rem;
      border: 2px solid #ffffff;
      border-radius: 999px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .support-link:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .try-pie-link {
      display: inline-block;
      padding: 0.75rem 1.35rem;
      border: 2px solid #ff7a00;
      border-radius: 999px;
      color: #0f0f0f;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #ffb000;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 0 1px rgba(255, 176, 0, 0.2), 0 8px 18px rgba(255, 122, 0, 0.35);
    }

    .try-pie-link:hover {
      background: #ffc13d;
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px rgba(255, 193, 61, 0.35), 0 10px 22px rgba(255, 122, 0, 0.45);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="viks-pizza-logo.png" alt="Vik's Pizza Logo" />
    <h1>VIK'S PIZZA</h1>
    <p>HACKING THE PIZZA CODE. </p>
	<p> Amazing pizza. Thoughtfully made.</p>
    <div class="coming-soon">FREE<hr class="coming-soon-divider" />WEEKENDS ONLY</div>
    <div class="cta-stack">
      <a class="try-pie-link" href="#">TRY A PIE</a>
      <a class="journey-link" href="journey.html">About My Journey</a>
      <a class="support-link" href="#">Support My Journey</a>
    </div>

  </div>
</body>
</html>
